<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>消防士向け 熱画像判読トレーニング (VRカメラ融合版)</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="<https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css>">

  <!-- Three.js (従来の安定したスクリプト読み込み) -->
  <script src="[suspicious link removed]"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 900px;
      position: relative;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .glass-card:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.25); }

    .btn-primary {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      border: none;
      color: #fff;
      font-weight: bold;
      padding: 12px;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
    }

    .screen-panel {
      position: absolute;
      inset: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease-out;
      background: #090d16;
      z-index: 10;
    }

    .hidden-screen { transform: translateX(100%); pointer-events: none; }

    #vrContainer {
      width: 100%;
      height: 360px;
      background: #000;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    input[type=range] { width: 100%; margin: 8px 0; }
  </style>
</head>
<body>

  <!-- カメラ用隠しビデオ -->
  <video id="cameraVideo" autoplay playsinline style="display:none;"></video>

  <div class="app-container">

    <!-- ==================== HOME SCREEN ==================== -->
    <div id="homeScreen" class="screen-panel" style="z-index: 20;">
      <div style="text-align: center; margin-top: 10px;">
        <i class="fa-solid fa-vr-cardboard" style="font-size: 3rem; color: #ffcc00;"></i>
        <h1 style="font-size: 1.5rem; margin-top: 10px;">熱画像判読トレーニング</h1>
        <p style="font-size: 0.8rem; color: #aaa;">VR対応 消防用TICシミュレーター</p>
      </div>

      <!-- パターン選択リスト -->
      <div style="flex: 1; overflow-y: auto; margin: 20px 0;">
        <div class="glass-card" onclick="launchThermal(1)">
          <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #4facfe;">
            <span>PATTERN 01</span><span>安定/低危険</span>
          </div>
          <h3 style="font-size: 1.1rem; margin-top: 6px;">初期火災（天井熱気流）</h3>
          <p style="font-size: 0.8rem; color: #ccc; margin-top: 4px;">天井付近のみ低温の熱蓄積。下層は正常。</p>
        </div>

        <div class="glass-card" onclick="launchThermal(2)">
          <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #ffcc00;">
            <span>PATTERN 02</span><span>警戒/中危険</span>
          </div>
          <h3 style="font-size: 1.1rem; margin-top: 6px;">熱気流降下（中層加熱）</h3>
          <p style="font-size: 0.8rem; color: #ccc; margin-top: 4px;">上層が高温化。熱気流が目線まで降下。</p>
        </div>

        <div class="glass-card" onclick="launchThermal(3)">
          <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #ff4757;">
            <span>PATTERN 03</span><span>極めて危険</span>
          </div>
          <h3 style="font-size: 1.1rem; margin-top: 6px;">フラッシュオーバー直前</h3>
          <p style="font-size: 0.8rem; color: #ccc; margin-top: 4px;">全層が高温化。超危険状態。</p>
        </div>
      </div>

      <p style="font-size: 0.7rem; color: #888; text-align: center;">※ Safari / Chrome ブラウザでカメラ利用を許可してください。</p>
    </div>

    <!-- ==================== VIEW SCREEN ==================== -->
    <div id="viewScreen" class="screen-panel hidden-screen">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <button onclick="closeThermal()" style="background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer;">
          <i class="fa-solid fa-arrow-left"></i> 戻る
        </button>
        <span id="viewTitle" style="font-weight: bold; font-size: 0.9rem;">パターンタイトル</span>
      </div>

      <!-- 3D VR モニター画面 -->
      <div id="vrContainer">
        <div style="position: absolute; top: 10px; left: 10px; font-size: 0.8rem; color: #ffcc00; font-family: monospace; z-index: 5;">
          <i class="fa-solid fa-video"></i> VR LIVE
        </div>
      </div>

      <!-- 解析テキスト -->
      <div style="background: rgba(0,0,0,0.5); padding: 12px; border-radius: 12px; font-size: 0.8rem; line-height: 1.5;">
        <div style="color: #00f2fe; font-weight: bold; margin-bottom: 4px;">【熱画像判定結果】</div>
        <div id="analysisText">----</div>
      </div>
    </div>

  </div>

  <script>
    const thermalData = {
      1: { title: "初期火災（天井熱気流）", top: 220, mid: 45, bot: 22, desc: "天井付近に薄い熱蓄積が見られますが、下層は低温を保っています。" },
      2: { title: "熱気流降下（中層加熱）", top: 480, mid: 240, bot: 50, desc: "上層部が著しく高温化。熱気流が目線付近まで降下しています。" },
      3: { title: "フラッシュオーバー直前", top: 660, mid: 510, bot: 280, desc: "室内全体が超高温域に達しており、極めて危険な状態です。" }
    };

    let scene, camera, renderer, videoTexture, material;
    let cameraStream = null;

    function initThree() {
      const container = document.getElementById('vrContainer');
      const w = container.clientWidth;
      const h = container.clientHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, w / h, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(w, h);
      container.appendChild(renderer.domElement);

      const video = document.getElementById('cameraVideo');
      videoTexture = new THREE.VideoTexture(video);

      // カスタムシェーダー（熱画像変換）
      material = new THREE.ShaderMaterial({
        uniforms: {
          tDiffuse: { value: videoTexture },
          uTopTemp: { value: 200.0 },
          uMidTemp: { value: 100.0 },
          uBotTemp: { value: 30.0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D tDiffuse;
          uniform float uTopTemp;
          uniform float uMidTemp;
          uniform float uBotTemp;
          varying vec2 vUv;

          void main() {
            vec4 col = texture2D(tDiffuse, vUv);
            float luma = dot(col.rgb, vec3(0.299, 0.587, 0.114));

            float ny = 1.0 - vUv.y;
            float temp = mix(uTopTemp, uBotTemp, ny) * (0.6 + luma * 0.8);

            float norm = clamp((temp - 20.0) / 600.0, 0.0, 1.0);
            vec3 finalCol = vec3(norm, norm * 0.3, 1.0 - norm);

            gl_FragColor = vec4(finalCol, 1.0);
          }
        `
      });

      const geometry = new THREE.PlaneGeometry(3.2, 2.0);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(0, 0, -2);
      scene.add(mesh);

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();
    }

    async function startCamera() {
      if (!cameraStream) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
          const video = document.getElementById('cameraVideo');
          video.srcObject = cameraStream;
          await video.play();
        } catch (e) {
          alert("カメラの起動に失敗しました。ブラウザのカメラ許可を確認してください。");
        }
      }
    }

    async function launchThermal(id) {
      const data = thermalData[id];
      document.getElementById('viewTitle').innerText = data.title;
      document.getElementById('analysisText').innerText = data.desc;

      await startCamera();

      if (!renderer) {
        initThree();
      }

      if (material) {
        material.uniforms.uTopTemp.value = data.top;
        material.uniforms.uMidTemp.value = data.mid;
        material.uniforms.uBotTemp.value = data.bot;
      }

      document.getElementById('viewScreen').classList.remove('hidden-screen');
    }

    function closeThermal() {
      document.getElementById('viewScreen').classList.add('hidden-screen');
    }
  </script>
</body>
</html>
