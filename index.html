<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>消防士向け 熱画像判読トレーニング (VRカメラ融合版)</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="<https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css>">

  <!-- Three.js (3D/VRレンダラー) -->
  <script src="[suspicious link removed]"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 900px;
      position: relative;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .glass-card:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.25); }

    .screen-panel {
      position: absolute;
      inset: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease-out;
      background: #090d16;
      z-index: 10;
    }

    .hidden-screen { transform: translateX(100%); pointer-events: none; }

    #canvasContainer {
      width: 100%;
      height: 360px;
      background: #000;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #statusMessage {
      position: absolute;
      color: #00f2fe;
      font-size: 0.8rem;
      font-weight: bold;
      z-index: 5;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>

  <!-- カメラ用隠しビデオ要素 -->
  <video id="cameraVideo" autoplay playsinline style="display:none;"></video>

  <div class="app-container">

    <!-- ==================== HOME SCREEN ==================== -->
    <div id="homeScreen" class="screen-panel" style="z-index: 20;">
      <div style="text-align: center; margin-top: 10px;">
        <i class="fa-solid fa-vr-cardboard" style="font-size: 3rem; color: #ffcc00;"></i>
        <h1 style="font-size: 1.5rem; margin-top: 10px;">熱画像判読トレーニング</h1>
        <p style="font-size: 0.8rem; color: #aaa;">VR対応 消防用TICシミュレーター</p>
      </div>

      <!-- パターン選択リスト -->
      <div style="flex: 1; overflow-y: auto; margin: 20px 0;">
        <div class="glass-card" onclick="launchThermal(1)">
          <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #4facfe;">
            <span>PATTERN 01</span><span>安定/低危険</span>
          </div>
          <h3 style="font-size: 1.1rem; margin-top: 6px;">初期火災（天井熱気流）</h3>
          <p style="font-size: 0.8rem; color: #ccc; margin-top: 4px;">天井付近のみ低温の熱蓄積。下層は正常。</p>
        </div>

        <div class="glass-card" onclick="launchThermal(2)">
          <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #ffcc00;">
            <span>PATTERN 02</span><span>警戒/中危険</span>
          </div>
          <h3 style="font-size: 1.1rem; margin-top: 6px;">熱気流降下（中層加熱）</h3>
          <p style="font-size: 0.8rem; color: #ccc; margin-top: 4px;">上層が高温化。熱気流が目線まで降下。</p>
        </div>

        <div class="glass-card" onclick="launchThermal(3)">
          <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #ff4757;">
            <span>PATTERN 03</span><span>極めて危険</span>
          </div>
          <h3 style="font-size: 1.1rem; margin-top: 6px;">フラッシュオーバー直前</h3>
          <p style="font-size: 0.8rem; color: #ccc; margin-top: 4px;">全層が高温化。超危険状態。</p>
        </div>
      </div>

      <p style="font-size: 0.71rem; color: #888; text-align: center;">※ Safari / Chrome 等の標準ブラウザで開いてご利用ください。</p>
    </div>

    <!-- ==================== VIEW SCREEN ==================== -->
    <div id="viewScreen" class="screen-panel hidden-screen">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <button onclick="closeThermal()" style="background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold;">
          <i class="fa-solid fa-arrow-left"></i> 戻る
        </button>
        <span id="viewTitle" style="font-weight: bold; font-size: 0.9rem;">パターンタイトル</span>
      </div>

      <!-- 3D VR モニター画面 -->
      <div id="canvasContainer">
        <div id="statusMessage">カメラ準備中...</div>
      </div>

      <!-- 解析テキスト -->
      <div style="background: rgba(0,0,0,0.6); padding: 14px; border-radius: 12px; font-size: 0.85rem; line-height: 1.5; border: 1px solid rgba(255,255,255,0.1); margin-top: 10px;">
        <div style="color: #00f2fe; font-weight: bold; margin-bottom: 6px;"><i class="fa-solid fa-magnifying-glass-chart"></i> 熱画像判定結果</div>
        <div id="analysisText">----</div>
      </div>
    </div>

  </div>

  <script>
    const thermalData = {
      1: { title: "初期火災（天井熱気流）", top: 220, mid: 45, bot: 22, desc: "天井付近（上層）に薄い熱蓄積が見られますが、中層・下層は正常温度（灰色）を保っています。" },
      2: { title: "熱気流降下（中層加熱）", top: 480, mid: 240, bot: 50, desc: "上層部が著しく高温化（赤色）。熱気流が中層（黄色）へ降下してきています。" },
      3: { title: "フラッシュオーバー直前", top: 660, mid: 510, bot: 280, desc: "室内全体が超高温域に達しており、フラッシュオーバーが切迫している極めて危険な状態です。" }
    };

    let scene, camera, renderer, videoTexture, material;
    let cameraStream = null;

    function initThree() {
      const container = document.getElementById('canvasContainer');
      const w = container.clientWidth;
      const h = container.clientHeight;

      if (typeof THREE === 'undefined') {
        document.getElementById('statusMessage').innerText = "3Dライブラリの読み込みに失敗しました。";
        return;
      }

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, w / h, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(w, h);
      container.appendChild(renderer.domElement);

      const video = document.getElementById('cameraVideo');
      videoTexture = new THREE.VideoTexture(video);

      // サーモグラフィーGLSLシェーダー
      material = new THREE.ShaderMaterial({
        uniforms: {
          tDiffuse: { value: videoTexture },
          uTopTemp: { value: 200.0 },
          uMidTemp: { value: 100.0 },
          uBotTemp: { value: 30.0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D tDiffuse;
          uniform float uTopTemp;
          uniform float uMidTemp;
          uniform float uBotTemp;
          varying vec2 vUv;

          void main() {
            vec4 col = texture2D(tDiffuse, vUv);
            float luma = dot(col.rgb, vec3(0.299, 0.587, 0.114));

            float ny = 1.0 - vUv.y;
            float temp;
            if (ny <= 0.5) {
              temp = mix(uTopTemp, uMidTemp, ny * 2.0);
            } else {
              temp = mix(uMidTemp, uBotTemp, (ny - 0.5) * 2.0);
            }
            temp = temp * (0.6 + luma * 0.8);

            float norm = clamp((temp - 20.0) / 600.0, 0.0, 1.0);
            vec3 finalCol;
            if (norm < 0.4) {
              finalCol = vec3(norm * 1.5, norm * 1.5, 0.8 - norm);
            } else {
              finalCol = vec3(1.0, 1.0 - (norm - 0.4) * 1.5, 0.0);
            }

            gl_FragColor = vec4(finalCol, 1.0);
          }
        `
      });

      const geometry = new THREE.PlaneGeometry(3.2, 2.0);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(0, 0, -2);
      scene.add(mesh);

      function animate() {
        requestAnimationFrame(animate);
        if (renderer && scene && camera) {
          renderer.render(scene, camera);
        }
      }
      animate();
    }

    async function startCamera() {
      const statusMsg = document.getElementById('statusMessage');
      if (!cameraStream) {
        try {
          statusMsg.innerText = "カメラ接続中...";
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
          const video = document.getElementById('cameraVideo');
          video.srcObject = cameraStream;
          await video.play();
          statusMsg.style.display = "none";
        } catch (e) {
          console.error(e);
          statusMsg.innerText = "カメラのアクセスに失敗しました。\nブラウザの設定でカメラを許可してください。";
        }
      } else {
        statusMsg.style.display = "none";
      }
    }

    async function launchThermal(id) {
      // 1. 失敗しても必ず画面を先に切り替える
      const data = thermalData[id];
      document.getElementById('viewTitle').innerText = data.title;
      document.getElementById('analysisText').innerText = data.desc;
      document.getElementById('viewScreen').classList.remove('hidden-screen');

      // 2. カメラと3D描画の初期化
      await startCamera();

      if (!renderer) {
        initThree();
      }

      if (material) {
        material.uniforms.uTopTemp.value = data.top;
        material.uniforms.uMidTemp.value = data.mid;
        material.uniforms.uBotTemp.value = data.bot;
      }
    }

    function closeThermal() {
      document.getElementById('viewScreen').classList.add('hidden-screen');
    }
  </script>
</body>
</html>
